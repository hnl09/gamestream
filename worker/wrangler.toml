name = "gamestream-rendezvous"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Plano gratuito: apenas Durable Objects com armazenamento SQLite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Limite de pedidos por IP (proteção da cota gratuita contra spam).
[[ratelimits]]
name = "LIMITER"
namespace_id = "7301"

  [ratelimits.simple]
  limit = 60
  period = 60

# Teste de conexão (cada teste usa 4 envios contínuos): até 5 testes por minuto por IP.
[[ratelimits]]
name = "HEAVY"
namespace_id = "7302"

  [ratelimits.simple]
  limit = 20
  period = 60

[observability]
enabled = false
