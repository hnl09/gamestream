[package]
name = "gamestream-android"
version = "0.1.0"
edition = "2021"
description = "Núcleo do GameStream para Android (rede e protocolo); a tela e o vídeo ficam no app Java."

[lib]
name = "gamestream"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
if-addrs = "0.13"
jni = "0.21"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
ureq = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
