name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        # A libopus embutida declara cmake_minimum_required(3.1); o CMake 4 só aceita com esta política.
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo build --release

      - name: Baixar FFmpeg e mpv
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory deps | Out-Null
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile deps\ffmpeg.zip
          Expand-Archive deps\ffmpeg.zip deps\ffmpeg
          Invoke-WebRequest "https://github.com/mpv-player/mpv/releases/download/v0.42.0/mpv-v0.42.0-x86_64-pc-windows-msvc.zip" -OutFile deps\mpv.zip
          Expand-Archive deps\mpv.zip deps\mpv
          $ff = (Get-ChildItem deps\ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          if (-not (& $ff -hide_banner -h filter=gfxcapture | Select-String "gfxcapture AVOptions")) {
            Write-Warning "Este FFmpeg não tem gfxcapture: a captura de janela vai usar o modo antigo (recorte)."
          }

      - name: Empacotar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory dist, out | Out-Null

          # Pacote principal: só o app (o player e o FFmpeg são baixados sozinhos quando precisar).
          Copy-Item target\release\gamestream.exe dist\
          Copy-Item LEIA-ME.txt, THIRD-PARTY.txt dist\
          Compress-Archive dist\* out\GameStream.zip

          # Player de vídeo (mpv): baixado pelo app na primeira vez que alguém assiste.
          New-Item -ItemType Directory mpvpkg | Out-Null
          $mpv = (Get-ChildItem deps\mpv -Recurse -Filter mpv.exe | Select-Object -First 1).DirectoryName
          Copy-Item "$mpv\mpv.exe" mpvpkg\
          Get-ChildItem $mpv -Filter *.dll | Copy-Item -Destination mpvpkg\
          Compress-Archive mpvpkg\* out\mpv.zip
          (Get-FileHash out\mpv.zip -Algorithm SHA256).Hash.ToLower() | Out-File -NoNewline -Encoding ascii out\mpv.zip.sha256

          # Para a atualização automática.
          Copy-Item target\release\gamestream.exe out\
          (Get-FileHash out\gamestream.exe -Algorithm SHA256).Hash.ToLower() | Out-File -NoNewline -Encoding ascii out\gamestream.exe.sha256

          # FFmpeg comprimido: o app baixa sozinho na primeira transmissão.
          $ff = (Get-ChildItem deps\ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          $in = [IO.File]::OpenRead($ff); $o = [IO.File]::Create("out\ffmpeg.exe.gz")
          $gz = New-Object IO.Compression.GZipStream($o, [IO.Compression.CompressionLevel]::Optimal)
          $in.CopyTo($gz); $gz.Dispose(); $in.Dispose(); $o.Dispose()
          (Get-FileHash out\ffmpeg.exe.gz -Algorithm SHA256).Hash.ToLower() | Out-File -NoNewline -Encoding ascii out\ffmpeg.exe.gz.sha256

          # App Android (montado e assinado no PC do desenvolvedor por android/build.ps1).
          if (Test-Path android\GameStream.apk) { Copy-Item android\GameStream.apk out\ }

          Get-ChildItem out | ForEach-Object { "{0,-26} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
