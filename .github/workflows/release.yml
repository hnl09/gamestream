name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        run: cargo build --release

      - name: Baixar FFmpeg e mpv
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory deps | Out-Null
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile deps\ffmpeg.zip
          Expand-Archive deps\ffmpeg.zip deps\ffmpeg
          Invoke-WebRequest "https://github.com/mpv-player/mpv/releases/download/v0.42.0/mpv-v0.42.0-x86_64-pc-windows-msvc.zip" -OutFile deps\mpv.zip
          Expand-Archive deps\mpv.zip deps\mpv

      - name: Empacotar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\gamestream.exe dist\
          Copy-Item (Get-ChildItem deps\ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName dist\
          $mpv = (Get-ChildItem deps\mpv -Recurse -Filter mpv.exe | Select-Object -First 1).DirectoryName
          Copy-Item "$mpv\mpv.exe" dist\
          Get-ChildItem $mpv -Filter *.dll | Copy-Item -Destination dist\
          Copy-Item LEIA-ME.txt, THIRD-PARTY.txt dist\
          Compress-Archive dist\* GameStream.zip

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GameStream.zip
          generate_release_notes: true
