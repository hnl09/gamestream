[package]
name = "gamestream"
version = "0.3.0"
edition = "2021"
description = "Stream de jogos com baixa latÃªncia: host (captura + encoder HEVC na GPU) e viewer nativo, via QUIC"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
eframe = "0.29"
if-addrs = "0.13"
igd-next = { version = "0.15", features = ["aio_tokio"] }
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.5"
tokio = { version = "1", features = ["full"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Console",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
