[package]
name = "gamestream"
version = "0.7.1"
edition = "2021"
description = "Transmissão de vídeo e áudio com baixa latência para Windows (HEVC acelerado por GPU + QUIC)"
license = "MIT"
repository = "https://github.com/hnl09/gamestream"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
eframe = "0.29"
flate2 = "1"
if-addrs = "0.13"
opus = "0.3"
igd-next = { version = "0.15", features = ["aio_tokio"] }
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.5"
tokio = { version = "1", features = ["full"] }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
ureq = "2"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.58"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
